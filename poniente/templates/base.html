{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Juego de Tronos{% endblock %}</title>
</head>
<body>
    <header>
        <p class="logo">Juego de Tronos</p>
        <nav>
            <a href="{% url 'index' %}">Inicio</a>
            <a href="{% url 'personaje_list' %}">Personajes</a>
            <a href="{% url 'casa_list' %}">Casas</a>
            <a href="{% url 'temporada_list' %}">Temporadas</a>
        </nav>
    </header>

    <main>
        {% block main %}
        {% endblock %}
    </main>

    <footer>
        <p>Proyecto de Ingeniería Web - Universidad de Deusto</p>
    </footer>
</body>
</html>
